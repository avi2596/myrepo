  .wrap, .wrap *, .wrap *::before, .wrap *::after { box-sizing: border-box; }

<script>
(function () {
  "use strict";

  var HALVES = [
    { key: "jan_jul", label: "Jan-Jul", full: "January to July" },
    { key: "aug_dec", label: "Aug-Dec", full: "August to December" }
  ];

  var raw = document.getElementById("data").textContent;
  var D;
  try { D = JSON.parse(raw); } catch (e) { D = null; }

  var table = document.getElementById("table");

  if (!D || !D.rows || !D.rows.length) {
    document.getElementById("headline").textContent = "No data embedded yet";
    document.getElementById("standfirst").innerHTML =
      "Run <code>python sp500_7by7.py --html --json</code> to fill this page in.";
    table.style.display = "none";
    document.getElementById("method").style.display = "none";
    return;
  }

  // ---------------------------------------------------------- formatting
  function pct(v, digits) {
    if (v === null || v === undefined) return "—";
    return (v >= 0 ? "+" : "") + v.toFixed(digits === undefined ? 2 : digits) + "%";
  }
  function price(v) {
    if (v === null || v === undefined) return "—";
    return v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function longDate(iso) {
    if (!iso) return "—";
    var p = iso.split("-");
    var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                  "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return Number(p[2]) + " " + months[Number(p[1]) - 1] + " " + p[0];
  }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  var thresh = (D.threshold % 1 === 0) ? String(D.threshold) : String(D.threshold);
  var S = D.summary || {};
  var B = D.baseline || {};

  // ------------------------------------------------------------- headline
  document.getElementById("headline").textContent =
    D.name + ": years up more than " + thresh + "% through July";

  var live = D.rows.filter(function (r) {
    return !r.halves.jan_jul.final || !r.halves.aug_dec.final;
  });

  var lead;
  if (S.settled && S.hit_rate !== null) {
    lead = "Since " + D.first_year + ", " + plural(S.qualifying, "year") + " gained more than " +
      thresh + "% over January to July. Of the <strong>" + S.settled +
      "</strong> whose full year is complete, August to December was positive <strong>" +
      S.up + "</strong> times — <strong>" + S.hit_rate.toFixed(0) + "%</strong> of them.";
  } else {
    lead = "Since " + D.first_year + ", " + plural(S.qualifying, "year") +
      " gained more than " + thresh + "% over January to July.";
  }
  document.getElementById("standfirst").innerHTML = lead;

  document.getElementById("asof").textContent =
    D.ticker + " · prices through " + longDate(D.asof) +
    (live.length ? " · " + live[0].year + " is still filling in" : "");

  // ---------------------------------------------------------------- tiles
  var tiles = [];
  if (S.settled) {
    tiles.push({
      label: "Aug–Dec positive",
      value: S.up + " of " + S.settled,
      note: S.hit_rate.toFixed(0) + "% of completed qualifying years"
    });
    tiles.push({
      label: "Average Aug–Dec",
      value: pct(S.avg),
      note: "median " + pct(S.median) + " · worst " + pct(S.worst)
    });
  }
  if (B.years) {
    var gap = (S.avg !== null && S.avg !== undefined) ? S.avg - B.avg : null;
    tiles.push({
      label: "Every year, for scale",
      value: pct(B.avg),
      // Non-breaking space: "pts" must not be orphaned onto its own line.
      note: "positive " + B.hit_rate.toFixed(0) + "% of " + B.years + " years" +
            (gap === null ? "" : " · gap " + pct(gap, 2).replace("%", " pts"))
    });
  }
  document.getElementById("tiles").innerHTML = tiles.map(function (t) {
    return '<div class="tile"><div class="label"></div>' +
           '<div class="value"></div><div class="note"></div></div>';
  }).join("");
  // Text set via textContent, never innerHTML: these strings carry numbers, and
  // building them as markup is how a stray character becomes broken layout.
  Array.prototype.forEach.call(document.querySelectorAll("#tiles .tile"), function (el, i) {
    el.querySelector(".label").textContent = tiles[i].label;
    el.querySelector(".value").textContent = tiles[i].value;
    el.querySelector(".note").textContent = tiles[i].note;
  });

  // ---------------------------------------------------------------- table
  document.getElementById("caption").textContent =
    "One row per qualifying year, " + D.first_year + "–" + D.last_year +
    ". Hover or focus a cell for the prices behind it.";

  var cols = document.createElement("colgroup");
  ["c-year"].concat(HALVES.map(function () { return "c-half"; })).forEach(function (cls) {
    var col = document.createElement("col");
    col.className = cls;
    cols.appendChild(col);
  });
  table.appendChild(cols);

  var head = document.createElement("thead");
  var hr = document.createElement("tr");
  ["Year"].concat(HALVES.map(function (h) { return h.label; })).forEach(function (label) {
    var th = document.createElement("th");
    th.scope = "col";
    th.textContent = label;
    hr.appendChild(th);
  });
  head.appendChild(hr);
  table.appendChild(head);

  var body = document.createElement("tbody");

  D.rows.forEach(function (row) {
    var tr = document.createElement("tr");
    var unfinished = !row.halves.jan_jul.final || !row.halves.aug_dec.final;
    if (unfinished) tr.className = "live";

    // A <th scope="row"> rather than a <td>: it labels the row for screen
    // readers, so a cell read out of context still says which year it is.
    var yearCell = document.createElement("th");
    yearCell.scope = "row";
    yearCell.className = "year";
    yearCell.textContent = row.year;
    if (unfinished) {
      var flag = document.createElement("span");
      flag.className = "flag";
      flag.textContent = "in progress";
      yearCell.appendChild(flag);
    }
    tr.appendChild(yearCell);

    HALVES.forEach(function (half) {
      var d = row.halves[half.key];
      var td = document.createElement("td");
      var has = d.pct !== null && d.pct !== undefined;
      td.className = "cell " + (!has ? "none" : (d.pct > 0 ? "up" : "down")) +
                     (has && !d.final ? " partial" : "");
      td.textContent = has ? pct(d.pct) + (d.final ? "" : "*") : "—";
      td.setAttribute("tabindex", "0");

      // Tooltip text: the working behind the percentage, or why there is none.
      var tip;
      if (!has) {
        tip = "<b>" + row.year + " " + half.full + "</b><br>" +
              '<span class="muted">Has not started yet — it fills in as the ' +
              "year goes on.</span>";
      } else {
        tip = "<b>" + row.year + " " + half.full + "</b><br>" +
              price(d.open) + " open " + longDate(d.from) + "<br>" +
              price(d.close) + " close " + longDate(d.through) + "<br>" +
              "<b>" + pct(d.pct) + "</b>" +
              (d.final ? "" : '<br><span class="muted">Still running — not final.</span>');
      }
      td.setAttribute("data-tip", tip);
      tr.appendChild(td);
    });

    body.appendChild(tr);
  });
  table.appendChild(body);

  // -------------------------------------------------------------- tooltip
  var tip = document.getElementById("tip");

  function show(el) {
    tip.innerHTML = el.getAttribute("data-tip");
    tip.classList.add("on");
    tip.setAttribute("aria-hidden", "false");
    var r = el.getBoundingClientRect();
    var t = tip.getBoundingClientRect();
    var left = r.left + r.width / 2 - t.width / 2;
    var top = r.top - t.height - 9;
    // Keep it on screen: flip below when it would clip the top, clamp sideways.
    if (top < 6) top = r.bottom + 9;
    left = Math.max(8, Math.min(left, window.innerWidth - t.width - 8));
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }
  function hide() {
    tip.classList.remove("on");
    tip.setAttribute("aria-hidden", "true");
  }

  Array.prototype.forEach.call(table.querySelectorAll("td.cell"), function (td) {
    td.addEventListener("mouseenter", function () { show(td); });
    td.addEventListener("mouseleave", hide);
    td.addEventListener("focus", function () { show(td); });
    td.addEventListener("blur", hide);
  });
  window.addEventListener("scroll", hide, true);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") hide();
  });

  // ------------------------------------------------- colour-blind-safe mode
  // Red/green is the requested coding, but it is the one pair ~8% of men
  // cannot separate. Blue for gains keeps the polarity legible; the sign in
  // every cell means colour is never the only channel either way.
  var wrap = document.querySelector(".wrap");
  document.getElementById("cvd").addEventListener("change", function () {
    wrap.style.setProperty("--gain", this.checked ? "#256abf" : "#157f3c");
  });

  // ---------------------------------------------------------------- method
  var note = [];
  note.push("<h2>Method</h2>");
  note.push("<p>Each half is measured from its <b>own first open to its last close</b> — " +
    "January's opening print to July's final close, then August's opening print to the " +
    "last close of the year. Adjusted prices from Yahoo Finance; " + D.ticker +
    " is a price index, so these are price returns and exclude dividends.</p>");
  note.push("<p>A year appears here the moment it clears " + thresh +
    "% over January to July. The <b>in progress</b> row is the year still running: " +
    "its Jan-Jul figure is a running total until July closes, and Aug-Dec stays empty " +
    "until August starts, then fills in as the rest of the year happens. " +
    "Figures marked <b>*</b> are not final, and unfinished years are left out of the " +
    "averages above.</p>");
  if (B.years) {
    note.push("<p>The comparison tile is August to December for <b>every</b> year " +
      B.first_year + "–" + B.last_year + ", qualifying or not. Without it a hit rate " +
      "says nothing: if the back half of the year is usually positive anyway, a strong " +
      "first half has told you nothing.</p>");
  }
  note.push("<p>Regenerate with <code>python sp500_7by7.py --html --json</code>. " +
    "Every number, heading and note on this page is derived from the embedded data " +
    "block, so a refresh restates all of it.</p>");
  document.getElementById("method").innerHTML = note.join("");
})();
</script>
